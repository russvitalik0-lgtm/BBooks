<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Подписные издания</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="logo"><img src="https://learn.algoritmika.org/uploads/2024/08/bb_logo.png" alt=""></div>
            <nav>
                <div class="nav-item">Ассортимент</div>
                <div class="nav-item">Адреса магазинов</div>
                <div class="nav-item">Поддержка и контакты</div>
            </nav>
        </header>
        <main>
            <section class="cover">
                <div class="left">
                    <div class="text-group">
                        <h1>Книги для всех</h1>
                        <p>Продаём книги с 1926 года.</p>
                        <div class="social-icons">
                            <div class="social-icon"><img src="https://learn.algoritmika.org/uploads/2024/06/yandex.png" alt=""></div>
                            <div class="social-icon"><img src="https://learn.algoritmika.org/uploads/2024/06/odnoklassniki.png" alt=""></div>
                            <div class="social-icon"><img src="https://learn.algoritmika.org/uploads/2024/06/vkontakte.png" alt=""></div>
                        </div>
                    </div>
                    <div class="btn-main">Смотреть каталог</div>
                </div>
                <div class="right"><img src="https://learn.algoritmika.org/uploads/2024/06/cover.png" alt=""></div>
            </section>
            <section class="main-way">
                <h1>
                    Основные направления
                </h1>
                <div>
                    <article>
                        <img src="https://learn.algoritmika.org/uploads/2024/06/item1.png" alt="Фото не загружено">
                        <p>Классическая и современная художественная проза</p>
                    </article>
                    <article>
                        <img src="https://learn.algoritmika.org/uploads/2024/06/item2.png" alt="Фото не загружено">
                        <p>Философия и история</p>
                    </article>
                    <article>
                        <img src="https://learn.algoritmika.org/uploads/2024/06/item3.png" alt="Фото не загружено">
                        <p>Литературоведение и теория театра и кино</p>
                    </article>
                    <article>
                        <img src="https://learn.algoritmika.org/uploads/2024/06/item4.png" alt="Фото не загружено">
                        <p>Альбомы по искусству, книги и журналы</p>
                    </article>
                </div>
            </section>
        </main>
    </body>
</html>
